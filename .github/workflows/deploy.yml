name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const {owner,repo}=context.repo;
            const artifactId=process.env.PAGES_ARTIFACT_ID;
            if(!/^\d+$/.test(artifactId))throw new Error('Missing uploaded Pages artifact ID');
            const {data:deployment}=await github.request('POST /repos/{owner}/{repo}/pages/deployments',{
              owner,repo,artifact_id:Number(artifactId),pages_build_version:context.sha,
              oidc_token:await core.getIDToken()
            });
            const deployment_id=deployment.id||deployment.status_url?.split('/').pop();
            if(!deployment_id)throw new Error('Pages deployment returned no ID');
            core.setOutput('page_url',deployment.page_url);
            const failures=new Set(['deployment_failed','deployment_perms_error','deployment_content_failed','deployment_cancelled','deployment_lost']);
            for(let attempt=0;attempt<60;attempt++){
              const {data}=await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}',{owner,repo,deployment_id});
              if(data.status==='succeed')return;
              if(failures.has(data.status))throw new Error('Pages deployment: '+data.status);
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel',{owner,repo,deployment_id}).catch(()=>{});
            throw new Error('Pages deployment timed out');
